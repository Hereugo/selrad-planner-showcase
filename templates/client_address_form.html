<div class="col-span-2">
  <label for="address" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Адрес</label>
  <select 
        id="address" 
        name="address" 
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" 
        required
        {% if not client %}disabled{% endif %}
    >
    <option 
            {% if not plan %} 
                selected
            {% elif plan.client != client %}
                selected
            {% endif %}
            value="" disabled>Выберите адрес текущего клиента</option>
    {% for address in addresses %}
    <option 
            value="{{ address.id }}"
            {% if address == plan.address %} selected {% endif %}
            >{{ address.street }}</option>
    {% endfor %}
  </select>
</div>
