<li>
  <button
        hx-get="{% url 'plan_show_map_default' %}?{{ urlencode }}"
        hx-target="#plans"
        type="button"
        hx-swap="innerHTML"
        class="flex items-center w-full p-2 text-gray-900 rounded-lg hover:bg-gray-100 group">
    <svg class="w-6 h-6 text-gray-500 transition duration-75 group-hover:text-gray-900" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
      <path fill-rule="evenodd" d="M11.906 1.994a8.002 8.002 0 0 1 8.09 8.421 7.996 7.996 0 0 1-1.297 3.957.996.996 0 0 1-.133.204l-.108.129c-.178.243-.37.477-.573.699l-5.112 6.224a1 1 0 0 1-1.545 0L5.982 15.26l-.002-.002a18.146 18.146 0 0 1-.309-.38l-.133-.163a.999.999 0 0 1-.13-.202 7.995 7.995 0 0 1 6.498-12.518ZM15 9.997a3 3 0 1 1-5.999 0 3 3 0 0 1 5.999 0Z" clip-rule="evenodd"/>
    </svg>
    <span class="ms-3 whitespace-nowrap">Показать на карте</span>
  </button>
</li>
<li>
  <button
      data-excelurl="{% url 'plans_excel' %}?{{ urlencode }}"
      type="button"
      id="excel-button"
      class="flex items-center w-full p-2 text-gray-900 rounded-lg hover:bg-gray-100 group">
    <svg class="w-5 h-5 text-gray-500 transition duration-75 group-hover:text-gray-900" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 13V4M7 14H5a1 1 0 0 0-1 1v4c0 .6.4 1 1 1h14c.6 0 1-.4 1-1v-4c0-.6-.4-1-1-1h-2m-1-5-4 5-4-5m9 8h0"/>
    </svg>
    <span class="ms-3 whitespace-nowrap">Скачать эксель</span>
  </a>
</li>
<script>
  document.getElementById("excel-button").addEventListener("click", function downloadExcel(e) {
      e.preventDefault();
      const url = document.getElementById("excel-button").dataset.excelurl;

      fetch(url)
        .then(response => response.blob())
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'report.xlsx';
          document.body.appendChild(a);
          a.click();
          a.remove();
        });
  });
</script>
